<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-B95PMP65K6"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-B95PMP65K6');
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>图片粘贴裁剪接续工具</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --line: #d8e0ec;
      --accent: #0a7b83;
      --text: #1b2a3a;
      --danger: #bd2d2d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top left, #e9f6f7, var(--bg) 55%);
      min-height: 100vh;
      overflow-y: auto;
      padding: 16px;
    }

    .wrap {
      /* max-width: 1100px; */
      margin: 0 auto;
      display: grid;
      gap: 12px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
    }

    .title-box {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
    }

    .app-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(10, 123, 131, 0.2);
    }

    .title {
      font-family: 'Outfit', "Microsoft YaHei", sans-serif;
      font-size: 24px;
      font-weight: 700;
      margin: 0;
      background: linear-gradient(135deg, var(--accent), #14a2ad);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hint {
      margin: 0;
      color: #536679;
      font-size: 14px;
    }

    .toolbar {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      gap: 12px;
      align-items: center;
      position: sticky;
      top: 8px;
      z-index: 30;
      box-shadow: 0 6px 16px rgba(27, 42, 58, 0.1);
      scrollbar-width: thin;
      scrollbar-color: var(--line) transparent;
      padding: 8px 16px;
    }

    .toolbar::-webkit-scrollbar {
      height: 4px;
    }

    .toolbar::-webkit-scrollbar-thumb {
      background-color: var(--line);
      border-radius: 4px;
    }

    .tool-group {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .tool-config {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #536679;
      font-size: 13px;
      flex-shrink: 0;
    }

    .tool-config label {
      white-space: nowrap;
    }

    .tool-config input[type="color"] {
      width: 36px;
      height: 32px;
      padding: 2px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
    }

    .tool-config input[type="range"] {
      width: 96px;
      accent-color: var(--accent);
    }

    .tool-config output {
      min-width: 32px;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .tool-divider {
      width: 1px;
      height: 24px;
      background: #c9d7e6;
      margin: 0 2px;
      flex-shrink: 0;
    }

    button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      flex-shrink: 0;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button.danger {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      display: none;
    }

    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      background: rgba(240, 249, 255, 0.96);
      backdrop-filter: blur(12px);
      color: #0369a1;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.5;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
      border: 1px solid rgba(186, 230, 253, 0.6);
      animation: toast-in 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
      pointer-events: auto;
      max-width: 380px;
      word-break: break-word;
      white-space: normal;
    }

    .toast.out {
      animation: toast-out 0.3s cubic-bezier(0.6, -0.28, 0.735, 0.045) forwards;
    }

    @keyframes toast-in {
      from { opacity: 0; transform: translateX(20px) scale(0.9); }
      to { opacity: 1; transform: translateX(0) scale(1); }
    }

    @keyframes toast-out {
      from { opacity: 1; transform: translateX(0) scale(1); }
      to { opacity: 0; transform: translateX(20px) scale(0.9); }
    }

    .canvas-box {
      overflow: auto;
      border: 1px dashed #99adbf;
      border-radius: 10px;
      background: #f8fbff;
      min-height: 260px;
      display: grid;
      place-items: center;
      padding: 8px;
    }

    canvas {
      max-width: none;
      display: block;
      background: #fff;
    }

    .empty {
      color: #688096;
      text-align: center;
      font-size: 14px;
      line-height: 1.8;
      padding: 24px 8px;
    }

    .metric {
      font-size: 13px;
      color: #34485c;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .metric span {
      background: #eef4fb;
      border: 1px solid #dbe7f5;
      border-radius: 6px;
      padding: 4px 8px;
    }

    .title-box {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .app-logo {
      width: 32px;
      height: 32px;
    }

    .app-logo svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .github-link {
      display: inline-flex;
      align-items: center;
      color: #536679;
      transition: color 0.2s;
    }

    .github-link:hover {
      color: var(--accent);
    }

    .github-link svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* 激活状态的工具样式 */
    button.btn-tool.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button.btn-tool:not(.active):hover {
      background: #f0f4f9;
      border-color: #abbcca;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <section class="panel">
      <div class="title-box">
        <div class="app-logo">
          <img src="favicon.svg" alt="Logo" />
        </div>
        <h1 class="title">ImageSplice Pro</h1>
        <a href="https://github.com/winse/image_splice" target="_blank" class="github-link" title="GitHub">
          <svg viewBox="0 0 16 16">
            <path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path>
          </svg>
        </a>
      </div>
      <p class="hint">按 <b>Ctrl + V</b> 粘贴图片；首次粘贴载入主图，再次 <b>Ctrl + V</b> 会按鼠标位置追加图片。所有添加元素都可统一<b>选择、拖拽移动、Delete 删除</b>。拖拽选择裁剪区间：普通拖拽重置，<b>Ctrl</b> 增加，<b>Shift</b> 减去；按 <b>Delete</b> 执行删除并接续。<br>“马赛克”拖拽打码；“标注”工具拖拽绘制；“划线/矩形/圆”时按住 <b>Shift</b> 可锁定水平/正方形/正圆；“圆/椭圆”从圆心开始绘制。</p>
    </section>

    <section class="panel toolbar">
      <div class="tool-group">
        <button id="btnUndo" title="撤销 (Ctrl+Z)" disabled>撤销</button>
        <button id="btnRedo" title="重做 (Ctrl+Y)" disabled>重做</button>
      </div>
      <div class="tool-divider" aria-hidden="true"></div>
      <div class="tool-group">
        <button id="btnSelect" class="btn-tool" title="选择删除区间 (S)" disabled>删除区间</button>
      </div>
      <div class="tool-divider" aria-hidden="true"></div>
      <div class="tool-group">
        <button id="btnMosaic" class="btn-tool" title="矩形马赛克 (M)" disabled>马赛克(M)</button>
        <button id="btnArrow" class="btn-tool" title="画箭头 (A)" disabled>箭头(A)</button>
        <button id="btnLine" class="btn-tool" title="划线 (L)" disabled>线(L)</button>
        <button id="btnRect" class="btn-tool" title="矩形 (R)" disabled>矩形(R)</button>
        <button id="btnCircle" class="btn-tool" title="圆形 (C)" disabled>圆形(C)</button>
        <button id="btnNumber" class="btn-tool" title="数字标注 (N)" disabled>数字(N)</button>
        <button id="btnText" class="btn-tool" title="文字标注 (T)" disabled>文字(T)</button>
      </div>

      <div class="tool-divider" aria-hidden="true"></div>
      <div class="tool-group">
        <button id="btnZoomReset" title="缩放还原 1:1" disabled>比例还原</button>
        <button id="btnRotateL" title="逆时针旋转 90°" disabled>左</button>
        <button id="btnRotateR" title="顺时针旋转 90°" disabled>右</button>
        <button id="btnFlipH" title="水平翻转" disabled>水平</button>
        <button id="btnFlipV" title="垂直翻转" disabled>垂直</button>
      </div>
      <div class="tool-divider" aria-hidden="true"></div>
      <div class="tool-group">
        <button id="btnReset" title="恢复到初始图片" disabled>重置</button>
      </div>
      <div class="tool-divider" aria-hidden="true"></div>
      <div class="tool-group">
        <button id="btnSave" class="primary" disabled>下载</button>
      </div>
      <div class="tool-divider" aria-hidden="true"></div>
      <div class="tool-group" style="gap: 16px;">
        <div id="strokeConfig" class="tool-group" style="display: none;">
          <div class="tool-config">
            <!-- <label for="strokeColor">颜色</label> -->
            <input id="strokeColor" type="color" value="#ff4d4f" aria-label="笔画颜色" />
          </div>
          <div class="tool-config">
            <!-- <label for="strokeWidth">粗细/字号</label> -->
            <input id="strokeWidth" type="range" min="1" max="64" step="1" value="4" />
            <output id="strokeWidthValue" for="strokeWidth">4px</output>
          </div>
        </div>
        <div id="textConfig" class="tool-group" style="display: none;">
          <div class="tool-config">
            <!-- <label for="textAnnotationInput">内容</label> -->
            <input id="textAnnotationInput" type="text" placeholder="输入文字" value="文字内容" style="width: 120px; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-size: 13px;" />
          </div>
          <div class="tool-divider" aria-hidden="true"></div>
        </div>
        <div id="numberConfig" class="tool-group" style="display: none;">
          <div class="tool-config">
            <label for="numberAnnotationInput">数字</label>
            <input id="numberAnnotationInput" type="number" value="1" style="width: 80px; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-size: 13px;" />
          </div>
          <div class="tool-divider" aria-hidden="true"></div>
        </div>
        <button id="btnQuickDelete" class="danger" style="display: none; padding: 4px 10px; font-weight: bold;">删除 (Del)</button>
      </div>
    </section>

    <div id="toastContainer" class="toast-container"></div>

    <section class="panel">
      <div id="metrics" class="metric"></div>
      <div class="canvas-box">
        <canvas id="mainCanvas" hidden role="img" aria-label="编辑中的图片画布"></canvas>
        <div id="empty" class="empty">未检测到图片<br />请先复制图片，再在此页面按 Ctrl + V</div>
      </div>
    </section>
  </div>

  <script>
    const canvas = document.getElementById("mainCanvas");
    const ctx = canvas.getContext("2d");
    const canvasBox = document.querySelector(".canvas-box");
    const empty = document.getElementById("empty");
    const toastContainer = document.getElementById("toastContainer");
    const metricsEl = document.getElementById("metrics");

    const btnUndo = document.getElementById("btnUndo");
    const btnRedo = document.getElementById("btnRedo");
    const btnSelect = document.getElementById("btnSelect");
    const btnMosaic = document.getElementById("btnMosaic");
    const btnArrow = document.getElementById("btnArrow");
    const btnLine = document.getElementById("btnLine");
    const btnRect = document.getElementById("btnRect");
    const btnCircle = document.getElementById("btnCircle");
    const btnNumber = document.getElementById("btnNumber");
    const btnText = document.getElementById("btnText");
    const btnZoomReset = document.getElementById("btnZoomReset");
    const btnRotateL = document.getElementById("btnRotateL");
    const btnRotateR = document.getElementById("btnRotateR");
    const btnFlipH = document.getElementById("btnFlipH");
    const btnFlipV = document.getElementById("btnFlipV");
    const btnReset = document.getElementById("btnReset");
    const btnSave = document.getElementById("btnSave");
    const btnQuickDelete = document.getElementById("btnQuickDelete");
    const strokeColorInput = document.getElementById("strokeColor");
    const strokeWidthInput = document.getElementById("strokeWidth");
    const strokeWidthValue = document.getElementById("strokeWidthValue");
    const textConfig = document.getElementById("textConfig");
    const textAnnotationInput = document.getElementById("textAnnotationInput");
    const numberConfig = document.getElementById("numberConfig");
    const numberAnnotationInput = document.getElementById("numberAnnotationInput");

    let imageData = null;
    let originalData = null;
    let selecting = false;
    let dragStartY = null;
    let dragCurrentY = null;
    let currentTool = "range"; // "range", "mosaic", "arrow", "line", "number"
    let annotations = []; // 存储 { type, data }
    let pastedImages = []; // 存储 { src, x, y, width, height }
    let draggingAnnotation = null;
    let draggingPastedImage = null;
    let selectedAnnotation = null;
    let selectedPastedImage = null;
    let dragAnnotationOffset = { x: 0, y: 0 };
    let dragPastedImageOffset = { x: 0, y: 0 };
    let numberCounter = 1;
    let cutRanges = [];
    let dragType = "range";
    let dragMode = "replace";
    let mosaicStart = null;
    let mosaicCurrent = null;
    let arrowStart = null;
    let arrowCurrent = null;
    let lineStart = null;
    let lineCurrent = null;
    let rectStart = null;
    let rectCurrent = null;
    let circleStart = null;
    let circleCurrent = null;
    let isShiftPressed = false;
    let lastPointerCanvasPoint = null;
    let hasMovedDuringDrag = false;
    const CUT_GAP_PX = 1;
    const CUT_GAP_COLOR = "#ffffff";
    const MOSAIC_BLOCK = 12;
    const MOSAIC_BLUR_RADIUS = 8;
    const DEFAULT_STROKE_COLOR = "#ff4d4f";
    const DEFAULT_STROKE_WIDTH = 4;
    const NUMBER_COLOR = "#ff3333";
    const NUMBER_BG = "#ffffff";
    const NUMBER_SIZE = 24;
    const CLICK_CLEAR_THRESHOLD = 2;
    const HANDLE_SIZE = 8;
    const HANDLE_PADDING = 4;
    const ZOOM_MIN = 0.2;
    const ZOOM_MAX = 8;
    const ZOOM_STEP = 0.1;
    let zoomScale = 1;
    const MAX_HISTORY = 30;
    const undoStack = [];
    const redoStack = [];
    const pastedImageSourceCache = new Map();

    const TOOL_DESCRIPTIONS = {
      range: () => "删除区间选择 - 拖拽选择要删除的垂直区间，也可选择和移动已添加元素",
      mosaic: () => `马赛克 - 拖拽矩形打码（块大小 ${MOSAIC_BLOCK}px）`,
      arrow: () => `画箭头 - 拖拽绘制箭头，可调整颜色和粗细（${getStrokeWidth()}px）`,
      line: () => `划线 - 拖拽绘制直线，按 Shift 锁定水平，可调整颜色和粗细（${getStrokeWidth()}px）`,
      rect: () => `矩形 - 拖拽绘制矩形，可调整颜色和粗细（${getStrokeWidth()}px）`,
      circle: () => `圆形 - 拖拽绘制圆形/椭圆，以起点为中心，可调整颜色和粗细（${getStrokeWidth()}px）`,
      number: () => `数字标注 - 点击图片放置数字（当前：${numberCounter}），可在上方数字框中修改`,
      text: () => `文字标注 - 点击图片放置文字（内容：${textAnnotationInput.value || "文字内容"}）`
    };

    function setStatus(text) {
      if (!text) return;
      // 避免重复的消息堆积
      const lastToast = toastContainer.lastElementChild;
      if (lastToast && lastToast.textContent === text) return;

      // 限制最多显示 2 个气泡，超过时移除最早的一个
      while (toastContainer.children.length >= 2) {
        toastContainer.firstElementChild.remove();
      }

      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = text;
      toastContainer.appendChild(toast);

      const removeToast = () => {
        toast.classList.add("out");
        toast.addEventListener("animationend", () => {
          toast.remove();
        }, { once: true });
      };

      // 3秒后移除
      const timer = setTimeout(removeToast, 3000);

      // 点击也可立即移除
      toast.onclick = () => {
        clearTimeout(timer);
        removeToast();
      };
    }

    function getStrokeColor() {
      return strokeColorInput?.value || DEFAULT_STROKE_COLOR;
    }

    function getStrokeWidth() {
      const val = parseInt(strokeWidthInput?.value, 10);
      if (isNaN(val) || val < 1) return DEFAULT_STROKE_WIDTH;
      if (val > 64) return 64;
      return val;
    }

    function syncStrokeControls() {
      strokeWidthValue.textContent = `${getStrokeWidth()}px`;
    }

    function getAnnotationStroke(ann) {
      return {
        color: ann.color || DEFAULT_STROKE_COLOR,
        width: Math.max(1, Number(ann.width) || DEFAULT_STROKE_WIDTH)
      };
    }

    function clearSelectedElement() {
      selectedAnnotation = null;
      selectedPastedImage = null;
    }

    function getSelectedElement() {
      if (selectedAnnotation) return { kind: "annotation", item: selectedAnnotation };
      if (selectedPastedImage) return { kind: "pastedImage", item: selectedPastedImage };
      return null;
    }

    function setSelectedElement(kind, item) {
      selectedAnnotation = kind === "annotation" ? item : null;
      selectedPastedImage = kind === "pastedImage" ? item : null;

      if (item) {
        if (kind === "pastedImage") {
          currentTool = "range";
        } else if (kind === "annotation") {
          currentTool = item.type;
          // 加载属性到控制面板
          if (item.color) strokeColorInput.value = item.color;
          if (item.width) {
            strokeWidthInput.value = item.width;
          } else if (item.size) {
            // 根据基础字号 14 转换回粗细滑块值
            let w = 4;
            if (item.type === "number") w = (item.size - 14) / 2;
            if (item.type === "text") w = (item.size - 14) / 3;
            strokeWidthInput.value = Math.max(1, Math.round(w));
          }
          syncStrokeControls();

          if (item.type === "text") {
            textAnnotationInput.value = item.val;
          } else if (item.type === "number") {
            numberAnnotationInput.value = item.val;
          }
        }
      }
    }

    function isSelectedElement(kind, item) {
      return (kind === "annotation" ? selectedAnnotation : selectedPastedImage) === item;
    }

    function getSelectedStrokeAnnotation() {
      return selectedAnnotation && (selectedAnnotation.type === "line" || selectedAnnotation.type === "arrow" || selectedAnnotation.type === "rect" || selectedAnnotation.type === "circle")
        ? selectedAnnotation
        : null;
    }

    function getElementLabel(target) {
      if (!target) return "";
      if (target.kind === "pastedImage") return "追加图片";
      if (target.item.type === "number") return "数字";
      if (target.item.type === "text") return "文字";
      if (target.item.type === "line") return "线条";
      if (target.item.type === "arrow") return "箭头";
      if (target.item.type === "rect") return "矩形";
      if (target.item.type === "circle") return "圆形";
      return "元素";
    }

    function describeSelectedElement(target) {
      if (!target) return "";
      if (target.kind === "pastedImage") {
        return `追加图位置: x=${Math.round(target.item.x)}, y=${Math.round(target.item.y)}`;
      }
      if (target.item.type === "number" || target.item.type === "text") {
        const label = target.item.type === "number" ? "数字" : "文字";
        return `${label}位置: x=${Math.round(target.item.pos.x)}, y=${Math.round(target.item.pos.y)}`;
      }
      return `${getElementLabel(target)}起点: x=${Math.round(target.item.from.x)}, y=${Math.round(target.item.from.y)}`;
    }

    function hasSelection() {
      return cutRanges.length > 0;
    }

    function normalizeRange(yA, yB) {
      const y1 = Math.max(0, Math.min(yA, yB));
      const y2 = Math.min(canvas.height, Math.max(yA, yB));
      const h = Math.max(0, Math.round(y2 - y1));
      if (h <= 0) return null;
      return { y1: Math.round(y1), y2: Math.round(y2), h };
    }

    function mergeRanges(ranges) {
      if (ranges.length <= 1) return [...ranges];
      const sorted = [...ranges].sort((a, b) => a.y1 - b.y1);
      const merged = [{ ...sorted[0] }];
      for (let i = 1; i < sorted.length; i++) {
        const cur = sorted[i];
        const last = merged[merged.length - 1];
        if (cur.y1 <= last.y2) {
          last.y2 = Math.max(last.y2, cur.y2);
          last.h = last.y2 - last.y1;
        } else {
          merged.push({ ...cur });
        }
      }
      return merged;
    }

    function addRange(ranges, range) {
      return mergeRanges([...ranges, { ...range }]);
    }

    function subtractRange(ranges, sub) {
      const out = [];
      for (const r of ranges) {
        if (sub.y2 <= r.y1 || sub.y1 >= r.y2) {
          out.push({ ...r });
          continue;
        }
        if (sub.y1 > r.y1) {
          out.push({ y1: r.y1, y2: sub.y1, h: sub.y1 - r.y1 });
        }
        if (sub.y2 < r.y2) {
          out.push({ y1: sub.y2, y2: r.y2, h: r.y2 - sub.y2 });
        }
      }
      return out.filter((r) => r.h > 0);
    }

    function getPreviewRanges() {
      if (!selecting || dragType !== "range") return cutRanges;
      const draft = normalizeRange(dragStartY, dragCurrentY);
      if (!draft) return cutRanges;
      if (dragMode === "add") return addRange(cutRanges, draft);
      if (dragMode === "subtract") return subtractRange(cutRanges, draft);
      return [draft];
    }

    function totalSelectedHeight(ranges) {
      return ranges.reduce((sum, r) => sum + r.h, 0);
    }

    function modeText(mode) {
      if (mode === "add") return "增加";
      if (mode === "subtract") return "减去";
      return "重置";
    }

    function clearSelection() {
      selecting = false;
      dragType = "range";
      dragStartY = null;
      dragCurrentY = null;
      dragMode = "replace";
      cutRanges = [];
      mosaicStart = null;
      mosaicCurrent = null;
      arrowStart = null;
      arrowCurrent = null;
      lineStart = null;
      lineCurrent = null;
      rectStart = null;
      rectCurrent = null;
      circleStart = null;
      circleCurrent = null;
    }

    function updateButtons() {
      const hasImage = !!imageData;
      btnUndo.disabled = !hasImage || undoStack.length === 0;
      btnRedo.disabled = !hasImage || redoStack.length === 0;

      btnSelect.disabled = !hasImage;
      btnMosaic.disabled = !hasImage;
      btnArrow.disabled = !hasImage;
      btnLine.disabled = !hasImage;
      btnRect.disabled = !hasImage;
      btnCircle.disabled = !hasImage;
      btnNumber.disabled = !hasImage;
      btnText.disabled = !hasImage;
      strokeColorInput.disabled = !hasImage;
      strokeWidthInput.disabled = !hasImage;

      // 更新激活工具的样式
      btnSelect.classList.toggle("active", hasImage && currentTool === "range");
      btnSelect.setAttribute("aria-pressed", hasImage && currentTool === "range");
      btnMosaic.classList.toggle("active", hasImage && currentTool === "mosaic");
      btnMosaic.setAttribute("aria-pressed", hasImage && currentTool === "mosaic");
      btnArrow.classList.toggle("active", hasImage && currentTool === "arrow");
      btnArrow.setAttribute("aria-pressed", hasImage && currentTool === "arrow");
      btnLine.classList.toggle("active", hasImage && currentTool === "line");
      btnLine.setAttribute("aria-pressed", hasImage && currentTool === "line");
      btnRect.classList.toggle("active", hasImage && currentTool === "rect");
      btnRect.setAttribute("aria-pressed", hasImage && currentTool === "rect");
      btnCircle.classList.toggle("active", hasImage && currentTool === "circle");
      btnCircle.setAttribute("aria-pressed", hasImage && currentTool === "circle");
      btnNumber.classList.toggle("active", hasImage && currentTool === "number");
      btnNumber.setAttribute("aria-pressed", hasImage && currentTool === "number");
      btnText.classList.toggle("active", hasImage && currentTool === "text");
      btnText.setAttribute("aria-pressed", hasImage && currentTool === "text");

      btnZoomReset.disabled = !hasImage;
      btnRotateL.disabled = !hasImage;
      btnRotateR.disabled = !hasImage;
      btnFlipH.disabled = !hasImage;
      btnFlipV.disabled = !hasImage;
      btnReset.disabled = !hasImage;
      btnSave.disabled = !hasImage;

      if (hasImage && (getSelectedElement() || hasSelection())) {
        btnQuickDelete.style.display = "inline-block";
      } else {
        btnQuickDelete.style.display = "none";
      }

      const showStroke = hasImage && (
        currentTool === "line" ||
        currentTool === "arrow" ||
        currentTool === "rect" ||
        currentTool === "circle" ||
        currentTool === "text" ||
        currentTool === "number" ||
        !!getSelectedStrokeAnnotation()
      );
      document.getElementById("strokeConfig").style.display = showStroke ? "inline-flex" : "none";
      textConfig.style.display = (hasImage && currentTool === "text") ? "inline-flex" : "none";
      numberConfig.style.display = (hasImage && currentTool === "number") ? "inline-flex" : "none";
    }

    function applyCanvasZoom() {
      if (!imageData) return;
      canvas.style.width = `${Math.round(canvas.width * zoomScale)}px`;
      canvas.style.height = `${Math.round(canvas.height * zoomScale)}px`;
    }

    function cloneImageData(src) {
      return new ImageData(new Uint8ClampedArray(src.data), src.width, src.height);
    }

    function clonePastedImages(src = []) {
      return src.map((item) => ({ ...item }));
    }

    function applyImageData(nextState) {
      const { data, anns, layers, counter } = nextState;
      canvas.width = data.width;
      canvas.height = data.height;
      imageData = cloneImageData(data);
      annotations = JSON.parse(JSON.stringify(anns || []));
      pastedImages = clonePastedImages(layers || []);
      clearSelectedElement();
      draggingAnnotation = null;
      draggingPastedImage = null;
      numberCounter = counter || 1;
      if (numberAnnotationInput) numberAnnotationInput.value = numberCounter;
      clearSelection();
      render();
    }

    function pushUndoState() {
      if (!imageData) return;
      undoStack.push({
        data: cloneImageData(imageData),
        anns: JSON.parse(JSON.stringify(annotations)),
        layers: clonePastedImages(pastedImages),
        counter: numberCounter
      });
      if (undoStack.length > MAX_HISTORY) undoStack.shift();
      redoStack.length = 0;
      updateButtons();
    }

    function clearHistory() {
      undoStack.length = 0;
      redoStack.length = 0;
      updateButtons();
    }

    function updateMetrics() {
      if (!imageData) {
        metricsEl.innerHTML = "";
        return;
      }
      const parts = [
        `<span>宽度: ${canvas.width}px</span>`,
        `<span>高度: ${canvas.height}px</span>`
      ];
      if (pastedImages.length > 0) {
        parts.push(`<span>追加图片: ${pastedImages.length} 张</span>`);
      }
      const ranges = getPreviewRanges();
      if (ranges.length > 0) {
        parts.push(`<span>区间数: ${ranges.length}</span>`);
        parts.push(`<span>将删除总高度: ${totalSelectedHeight(ranges)}px</span>`);
      }
      parts.push(`<span>缩放: ${(zoomScale * 100).toFixed(0)}%</span>`);
      if (selecting) {
        if (dragType === "range") {
          parts.push(`<span>当前模式: ${modeText(dragMode)}</span>`);
        } else if (dragType === "mosaic") {
          const rect = normalizeRect(mosaicStart, mosaicCurrent);
          if (rect) {
            parts.push(`<span>马赛克区域: ${rect.w} x ${rect.h}px</span>`);
          }
        } else if (dragType === "arrow" && arrowStart && arrowCurrent) {
          parts.push(`<span>箭头长度: ${Math.round(Math.hypot(arrowCurrent.x - arrowStart.x, arrowCurrent.y - arrowStart.y))}px</span>`);
        } else if (dragType === "line" && lineStart && lineCurrent) {
          const lineEnd = getPreviewLineEnd();
          parts.push(`<span>线段长度: ${Math.round(Math.hypot(lineEnd.x - lineStart.x, lineEnd.y - lineStart.y))}px</span>`);
        } else if (dragType === "rect" && rectStart && rectCurrent) {
          const rect = normalizeRect(rectStart, rectCurrent);
          if (rect) {
            parts.push(`<span>矩形尺寸: ${rect.w} x ${rect.h}px</span>`);
          }
        } else if (dragType === "circle" && circleStart && circleCurrent) {
          const radius = Math.round(Math.hypot(circleCurrent.x - circleStart.x, circleCurrent.y - circleStart.y));
          parts.push(`<span>圆半径: ${radius}px</span>`);
        }
      }
      const selectedElement = getSelectedElement();
      if (selectedElement) {
        parts.push(`<span>已选中: ${getElementLabel(selectedElement)}</span>`);
        parts.push(`<span>${describeSelectedElement(selectedElement)}</span>`);
      }
      const desc = TOOL_DESCRIPTIONS[currentTool] ? TOOL_DESCRIPTIONS[currentTool]() : getToolName(currentTool);
      parts.push(`<span>当前工具: ${desc}</span>`);
      metricsEl.innerHTML = parts.join("");
    }


    function getToolName(tool) {
      if (tool === "range") return "删除区间";
      if (tool === "mosaic") return "矩形马赛克";
      if (tool === "arrow") return "画箭头";
      if (tool === "line") return "划线";
      if (tool === "rect") return "矩形";
      if (tool === "circle") return "圆形";
      if (tool === "number") return "数字标注";
      if (tool === "text") return "文字标注";
      return "未知";
    }
    function normalizeRect(a, b) {
      if (!a || !b) return null;
      const x1 = Math.max(0, Math.min(a.x, b.x));
      const y1 = Math.max(0, Math.min(a.y, b.y));
      const x2 = Math.min(canvas.width, Math.max(a.x, b.x));
      const y2 = Math.min(canvas.height, Math.max(a.y, b.y));
      const w = Math.max(0, Math.round(x2 - x1));
      const h = Math.max(0, Math.round(y2 - y1));
      if (w <= 0 || h <= 0) return null;
      return { x: Math.round(x1), y: Math.round(y1), w, h };
    }

    function constrainLinePoint(from, to, lockHorizontal = false) {
      if (!from || !to) return to;
      if (!lockHorizontal) return to;
      return { x: to.x, y: from.y };
    }

    function getPreviewLineEnd() {
      return constrainLinePoint(lineStart, lineCurrent, isShiftPressed);
    }

    function createPastedImageSnapshot(img) {
      const tempCanvas = document.createElement("canvas");
      tempCanvas.width = img.naturalWidth || img.width;
      tempCanvas.height = img.naturalHeight || img.height;
      const tctx = tempCanvas.getContext("2d");
      tctx.drawImage(img, 0, 0, tempCanvas.width, tempCanvas.height);
      const src = tempCanvas.toDataURL("image/png");
      pastedImageSourceCache.set(src, tempCanvas);
      return {
        src,
        width: tempCanvas.width,
        height: tempCanvas.height
      };
    }

    function getPastedImageSource(layer) {
      return pastedImageSourceCache.get(layer.src) || null;
    }

    function getCanvasPointFromClient(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }

    function updatePointerCanvasPoint(clientX, clientY) {
      if (!imageData) {
        lastPointerCanvasPoint = null;
        return;
      }
      const rect = canvas.getBoundingClientRect();
      const inside = clientX >= rect.left && clientX <= rect.right && clientY >= rect.top && clientY <= rect.bottom;
      lastPointerCanvasPoint = inside ? getCanvasPointFromClient(clientX, clientY) : null;
    }

    function expandBaseCanvas(nextWidth, nextHeight) {
      if (!imageData) return;
      if (nextWidth <= canvas.width && nextHeight <= canvas.height) return;
      const tempCanvas = document.createElement("canvas");
      tempCanvas.width = Math.max(nextWidth, canvas.width);
      tempCanvas.height = Math.max(nextHeight, canvas.height);
      const tctx = tempCanvas.getContext("2d");
      tctx.fillStyle = "#ffffff";
      tctx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
      tctx.putImageData(imageData, 0, 0);
      canvas.width = tempCanvas.width;
      canvas.height = tempCanvas.height;
      imageData = tctx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
    }

    function getPastePosition(snapshot) {
      if (!imageData) return { x: 0, y: 0 };
      if (lastPointerCanvasPoint) {
        return {
          x: Math.max(0, Math.round(lastPointerCanvasPoint.x)),
          y: Math.max(0, Math.round(lastPointerCanvasPoint.y))
        };
      }
      return {
        x: Math.max(0, Math.round((canvas.width - snapshot.width) / 2)),
        y: Math.max(0, Math.round((canvas.height - snapshot.height) / 2))
      };
    }

    function appendImageToCanvas(img) {
      if (!imageData) {
        loadImageToCanvas(img);
        return;
      }
      const snapshot = createPastedImageSnapshot(img);
      const pastePos = getPastePosition(snapshot);
      pushUndoState();
      expandBaseCanvas(
        Math.max(canvas.width, pastePos.x + snapshot.width),
        Math.max(canvas.height, pastePos.y + snapshot.height)
      );
      const layer = {
        src: snapshot.src,
        x: pastePos.x,
        y: pastePos.y,
        width: snapshot.width,
        height: snapshot.height
      };
      pastedImages.push(layer);
      setSelectedElement("pastedImage", layer);
      clearSelection();
      setStatus(`已追加图片: ${snapshot.width} x ${snapshot.height}，放置在 x=${layer.x}, y=${layer.y}`);
      render();
    }

    function getAnnotationBounds(ann) {
      if (!ann) return null;
      let minX, minY, maxX, maxY;
      if (ann.type === "number" || ann.type === "text") {
        const size = ann.size || (ann.type === "number" ? NUMBER_SIZE : 16);
        let w = size;
        let h = size;
        if (ann.type === "text") {
          ctx.save();
          ctx.font = `bold ${size}px "Microsoft YaHei", sans-serif`;
          const metrics = ctx.measureText(ann.val);
          w = metrics.width + 16;
          h = size + 16;
          ctx.restore();
        } else {
          w = size * 1.8;
          h = size * 1.8;
        }
        minX = ann.pos.x - w / 2;
        maxX = ann.pos.x + w / 2;
        minY = ann.pos.y - h / 2;
        maxY = ann.pos.y + h / 2;
      } else if (ann.type === "circle") {
        const rx = Math.abs(ann.to.x - ann.from.x);
        const ry = Math.abs(ann.to.y - ann.from.y);
        minX = ann.from.x - rx;
        maxX = ann.from.x + rx;
        minY = ann.from.y - ry;
        maxY = ann.from.y + ry;
      } else {
        minX = Math.min(ann.from.x, ann.to.x);
        maxX = Math.max(ann.from.x, ann.to.x);
        minY = Math.min(ann.from.y, ann.to.y);
        maxY = Math.max(ann.from.y, ann.to.y);
      }
      return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
    }

    function getAnnotationHandles(ann) {
      if (ann.type === "arrow" || ann.type === "line") {
        return [
          { x: ann.from.x, y: ann.from.y, type: "from" },
          { x: ann.to.x, y: ann.to.y, type: "to" }
        ];
      }
      if (ann.type === "number" || ann.type === "text") {
        return [];
      }
      const bounds = getAnnotationBounds(ann);
      if (!bounds) return [];
      const { x, y, w, h } = bounds;
      const midX = x + w / 2;
      const midY = y + h / 2;
      return [
        { x: x, y: y, type: "nw" },
        { x: midX, y: y, type: "n" },
        { x: x + w, y: y, type: "ne" },
        { x: x, y: midY, type: "w" },
        { x: x + w, y: midY, type: "e" },
        { x: x, y: y + h, type: "sw" },
        { x: midX, y: y + h, type: "s" },
        { x: x + w, y: y + h, type: "se" }
      ];
    }

    function commitPastedImagesToBase() {
      if (!imageData || pastedImages.length === 0) return;
      const tempCanvas = document.createElement("canvas");
      tempCanvas.width = canvas.width;
      tempCanvas.height = canvas.height;
      const tctx = tempCanvas.getContext("2d");
      tctx.putImageData(imageData, 0, 0);
      for (const layer of pastedImages) {
        const source = getPastedImageSource(layer);
        if (!source) continue;
        tctx.drawImage(source, layer.x, layer.y, layer.width, layer.height);
      }
      imageData = tctx.getImageData(0, 0, canvas.width, canvas.height);
      pastedImages = [];
      clearSelectedElement();
      draggingPastedImage = null;
    }

    function drawPastedImageSelection(layer) {
      ctx.save();
      ctx.strokeStyle = "rgba(0, 120, 215, 0.9)";
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 4]);
      ctx.strokeRect(layer.x + 1, layer.y + 1, Math.max(0, layer.width - 2), Math.max(0, layer.height - 2));
      // 绘制右下角缩放控制点
      const handleSize = 8;
      ctx.setLineDash([]);
      ctx.fillStyle = "rgba(0, 120, 215, 0.9)";
      ctx.fillRect(layer.x + layer.width - handleSize, layer.y + layer.height - handleSize, handleSize, handleSize);
      ctx.restore();
    }

    function drawAnnotationHandles(ann) {
      const handles = getAnnotationHandles(ann);
      if (handles.length === 0) return;
      ctx.save();
      ctx.strokeStyle = "rgba(0, 120, 215, 0.9)";
      ctx.lineWidth = 1;
      if (ann.type === "rect" || ann.type === "circle") {
        const bounds = getAnnotationBounds(ann);
        if (bounds) {
          ctx.setLineDash([4, 4]);
          ctx.strokeRect(bounds.x, bounds.y, bounds.w, bounds.h);
        }
      }
      ctx.setLineDash([]);
      ctx.fillStyle = "#fff";
      for (const h of handles) {
        ctx.beginPath();
        ctx.arc(h.x, h.y, HANDLE_SIZE / 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }
      ctx.restore();
    }

    function findPastedImageAt(p) {
      const padding = 5;
      const resizeHandle = 10;
      for (let i = pastedImages.length - 1; i >= 0; i--) {
        const layer = pastedImages[i];
        if (
          p.x >= layer.x - padding &&
          p.x <= layer.x + layer.width + padding &&
          p.y >= layer.y - padding &&
          p.y <= layer.y + layer.height + padding
        ) {
          // 检测右下角缩放控制点
          if (
            p.x >= layer.x + layer.width - resizeHandle &&
            p.x <= layer.x + layer.width + resizeHandle &&
            p.y >= layer.y + layer.height - resizeHandle &&
            p.y <= layer.y + layer.height + resizeHandle
          ) {
            return { kind: "pastedImage", item: layer, resize: true };
          }
          return { kind: "pastedImage", item: layer, resize: false };
        }
      }
      return null;
    }

    function clampPastedImagePosition(layer, x, y) {
      const nextWidth = Math.max(canvas.width, Math.round(x + layer.width));
      const nextHeight = Math.max(canvas.height, Math.round(y + layer.height));
      expandBaseCanvas(nextWidth, nextHeight);
      return {
        x: Math.max(0, Math.round(x)),
        y: Math.max(0, Math.round(y))
      };
    }

    function findElementAt(p) {
      // 优先检测当前选中元素的控制点
      const selected = getSelectedElement();
      if (selected && selected.kind === "annotation") {
        const handles = getAnnotationHandles(selected.item);
        for (const h of handles) {
          if (Math.hypot(p.x - h.x, p.y - h.y) < HANDLE_SIZE) {
            return { kind: "annotation", item: selected.item, handle: h.type };
          }
        }
      }

      const ann = findAnnotationAt(p);
      if (ann) return { kind: "annotation", item: ann };
      const layerResult = findPastedImageAt(p);
      if (layerResult) return layerResult;
      return null;
    }

    function startDraggingElement(target, p) {
      if (!target) return false;
      setSelectedElement(target.kind, target.item);
      if (target.kind === "pastedImage") {
        draggingPastedImage = target.item;
        if (target.resize) {
          draggingPastedImage._resizing = true;
          draggingPastedImage._origW = target.item.width;
          draggingPastedImage._origH = target.item.height;
          draggingPastedImage._origX = target.item.x;
          draggingPastedImage._origY = target.item.y;
          dragPastedImageOffset = { x: p.x, y: p.y };
        } else {
          draggingPastedImage._resizing = false;
          dragPastedImageOffset = { x: p.x - target.item.x, y: p.y - target.item.y };
        }
      } else {
        draggingAnnotation = target.item;
        draggingAnnotation._handle = target.handle;
        if (target.handle) {
          draggingAnnotation._origFrom = { ...target.item.from };
          draggingAnnotation._origTo = { ...target.item.to };
        }
        if (target.item.type === "number" || target.item.type === "text") {
          dragAnnotationOffset = { x: p.x - target.item.pos.x, y: p.y - target.item.pos.y };
        } else {
          dragAnnotationOffset = { x: p.x, y: p.y };
        }
      }
      setStatus(`已选中${getElementLabel(target)}，拖拽可移动，按 Delete 键或点击按钮移除`);
      return true;
    }

    function moveDraggingElement(p) {
      if (draggingPastedImage || draggingAnnotation) {
        if (!hasMovedDuringDrag) {
          pushUndoState();
          hasMovedDuringDrag = true;
        }
      }
      if (draggingPastedImage) {
        if (draggingPastedImage._resizing) {
          const dx = p.x - dragPastedImageOffset.x;
          const dy = p.y - dragPastedImageOffset.y;
          const origW = draggingPastedImage._origW;
          const origH = draggingPastedImage._origH;

          let nextW = Math.max(10, Math.round(origW + dx));
          let nextH = Math.max(10, Math.round(origH + dy));

          if (isShiftPressed) {
            // 等比例缩放：取变化较大的那个轴的缩放比例
            const scale = Math.max(nextW / origW, nextH / origH);
            nextW = Math.round(origW * scale);
            nextH = Math.round(origH * scale);
          }

          draggingPastedImage.width = nextW;
          draggingPastedImage.height = nextH;
        } else {
          const nextPos = clampPastedImagePosition(
            draggingPastedImage,
            p.x - dragPastedImageOffset.x,
            p.y - dragPastedImageOffset.y
          );
          draggingPastedImage.x = nextPos.x;
          draggingPastedImage.y = nextPos.y;
        }
        return true;
      }

      if (draggingAnnotation) {
        if (draggingAnnotation._handle) {
          const h = draggingAnnotation._handle;
          const origFrom = draggingAnnotation._origFrom;
          const origTo = draggingAnnotation._origTo;

          if (h === "from") {
            draggingAnnotation.from.x = p.x;
            draggingAnnotation.from.y = p.y;
          } else if (h === "to") {
            draggingAnnotation.to.x = p.x;
            draggingAnnotation.to.y = p.y;
          } else if (draggingAnnotation.type === "circle") {
            const rx = Math.abs(origTo.x - origFrom.x);
            const ry = Math.abs(origTo.y - origFrom.y);
            let minX = origFrom.x - rx; let maxX = origFrom.x + rx;
            let minY = origFrom.y - ry; let maxY = origFrom.y + ry;

            if (h.includes("w")) minX = p.x;
            if (h.includes("e")) maxX = p.x;
            if (h.includes("n")) minY = p.y;
            if (h.includes("s")) maxY = p.y;

            draggingAnnotation.from.x = (minX + maxX) / 2;
            draggingAnnotation.from.y = (minY + maxY) / 2;
            draggingAnnotation.to.x = draggingAnnotation.from.x + Math.abs(maxX - minX) / 2;
            draggingAnnotation.to.y = draggingAnnotation.from.y + Math.abs(maxY - minY) / 2;
          } else {
            if (h.includes("w")) {
              if (origFrom.x < origTo.x) draggingAnnotation.from.x = p.x;
              else draggingAnnotation.to.x = p.x;
            }
            if (h.includes("e")) {
              if (origFrom.x > origTo.x) draggingAnnotation.from.x = p.x;
              else draggingAnnotation.to.x = p.x;
            }
            if (h.includes("n")) {
              if (origFrom.y < origTo.y) draggingAnnotation.from.y = p.y;
              else draggingAnnotation.to.y = p.y;
            }
            if (h.includes("s")) {
              if (origFrom.y > origTo.y) draggingAnnotation.from.y = p.y;
              else draggingAnnotation.to.y = p.y;
            }
          }
          return true;
        }

        if (draggingAnnotation.type === "number" || draggingAnnotation.type === "text") {
          draggingAnnotation.pos.x = p.x - dragAnnotationOffset.x;
          draggingAnnotation.pos.y = p.y - dragAnnotationOffset.y;
        } else {
          const dx = p.x - dragAnnotationOffset.x;
          const dy = p.y - dragAnnotationOffset.y;
          draggingAnnotation.from.x += dx;
          draggingAnnotation.from.y += dy;
          draggingAnnotation.to.x += dx;
          draggingAnnotation.to.y += dy;
          dragAnnotationOffset = { x: p.x, y: p.y };
        }
        return true;
      }

      return false;
    }

    function finishDraggingElement() {
      if (draggingPastedImage) {
        setStatus(`追加图片位置已更新: x=${Math.round(draggingPastedImage.x)}, y=${Math.round(draggingPastedImage.y)}`);
        draggingPastedImage = null;
        render();
        return true;
      }
      if (draggingAnnotation) {
        setStatus(`${getElementLabel({ kind: "annotation", item: draggingAnnotation })}位置已更新`);
        draggingAnnotation = null;
        render();
        return true;
      }
      return false;
    }

    function deleteSelectedElement() {
      const target = getSelectedElement();
      if (!target) return false;
      pushUndoState();
      if (target.kind === "pastedImage") {
        pastedImages = pastedImages.filter((item) => item !== target.item);
      } else {
        annotations = annotations.filter((item) => item !== target.item);
      }
      clearSelectedElement();
      setStatus(`已删除选中的${getElementLabel(target)}`);
      render();
      return true;
    }


    function drawSelectionOverlay() {
      const ranges = getPreviewRanges();
      if (ranges.length > 0) {
        for (const r of ranges) {
          ctx.save();
          ctx.fillStyle = "rgba(189,45,45,0.22)";
          ctx.strokeStyle = "rgba(189,45,45,0.9)";
          ctx.lineWidth = 2;
          ctx.fillRect(0, r.y1, canvas.width, r.h);
          if (r.h >= 2) {
            ctx.strokeRect(1, r.y1 + 1, canvas.width - 2, r.h - 2);
          }
          ctx.restore();
        }
      }

      if (selecting && dragType === "mosaic") {
        const rect = normalizeRect(mosaicStart, mosaicCurrent);
        if (rect) {
          ctx.save();
          ctx.fillStyle = "rgba(10,123,131,0.22)";
          ctx.strokeStyle = "rgba(10,123,131,0.95)";
          ctx.lineWidth = 2;
          ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
          ctx.strokeRect(rect.x + 1, rect.y + 1, Math.max(0, rect.w - 2), Math.max(0, rect.h - 2));
          ctx.restore();
        }
      }

      if (selecting && dragType === "arrow" && arrowStart && arrowCurrent) {
        drawArrow(ctx, arrowStart, arrowCurrent, {
          color: getStrokeColor(),
          width: getStrokeWidth()
        });
      }

      if (selecting && dragType === "line" && lineStart && lineCurrent) {
        drawLine(ctx, lineStart, getPreviewLineEnd(), {
          color: getStrokeColor(),
          width: getStrokeWidth()
        });
      }
      if (selecting && dragType === "rect" && rectStart && rectCurrent) {
        drawRect(ctx, rectStart, getPreviewRectEnd(rectStart, rectCurrent, isShiftPressed), {
          color: getStrokeColor(),
          width: getStrokeWidth()
        });
      }
      if (selecting && dragType === "circle" && circleStart && circleCurrent) {
        drawCircle(ctx, circleStart, getPreviewCircleEnd(circleStart, circleCurrent, isShiftPressed), {
          color: getStrokeColor(),
          width: getStrokeWidth()
        });
      }
    }

    function drawShape(pCtx, type, from, to, style = {}) {
      const { color, width } = getAnnotationStroke(style);
      pCtx.save();
      pCtx.strokeStyle = color;
      pCtx.lineWidth = width;
      pCtx.lineCap = 'round';
      pCtx.lineJoin = 'round';
      if (type === 'line') {
        pCtx.beginPath();
        pCtx.moveTo(from.x, from.y);
        pCtx.lineTo(to.x, to.y);
        pCtx.stroke();
      } else if (type === 'rect') {
        pCtx.strokeRect(from.x, from.y, to.x - from.x, to.y - from.y);
      } else if (type === 'circle') {
        const rx = Math.abs(to.x - from.x);
        const ry = Math.abs(to.y - from.y);
        if (rx < 0.5 && ry < 0.5) {
          pCtx.restore();
          return;
        }
        pCtx.beginPath();
        if (pCtx.ellipse) {
          pCtx.ellipse(from.x, from.y, rx, ry, 0, 0, Math.PI * 2);
        } else {
          pCtx.arc(from.x, from.y, Math.max(rx, ry), 0, Math.PI * 2);
        }
        pCtx.stroke();
      }
      pCtx.restore();
    }
    function drawLine(pCtx, from, to, style = {}) {
      drawShape(pCtx, 'line', from, to, style);
    }
    function drawRect(pCtx, from, to, style = {}) {
      drawShape(pCtx, 'rect', from, to, style);
    }
    function drawCircle(pCtx, from, to, style = {}) {
      drawShape(pCtx, 'circle', from, to, style);
    }

    function getPreviewRectEnd(start, current, shift) {
      if (!shift) return current;
      const dx = current.x - start.x;
      const dy = current.y - start.y;
      const side = Math.max(Math.abs(dx), Math.abs(dy));
      return {
        x: start.x + Math.sign(dx || 1) * side,
        y: start.y + Math.sign(dy || 1) * side
      };
    }

    function getPreviewCircleEnd(start, current, shift) {
      if (!shift) return current;
      const dx = current.x - start.x;
      const dy = current.y - start.y;
      const radius = Math.hypot(dx, dy);
      return {
        x: start.x + radius,
        y: start.y + radius
      };
    }
    function drawArrow(pCtx, from, to, style = {}) {
      const dist = Math.hypot(to.x - from.x, to.y - from.y);
      if (dist < 5) return;
      const { color, width } = getAnnotationStroke(style);
      const angle = Math.atan2(to.y - from.y, to.x - from.x);
      const scale = Math.min(1.25, Math.max(0.7, dist / 150));
      const shaftStartWidth = Math.max(2, width * 0.65) * scale;
      const shaftEndWidth = Math.max(shaftStartWidth + 2, width * 1.9) * scale;
      const headWidth = Math.max(shaftEndWidth * 2.1, width * 5) * scale;
      const headLength = Math.max(18, width * 6) * scale;
      pCtx.save();
      pCtx.fillStyle = color;
      const vX = Math.cos(angle + Math.PI / 2);
      const vY = Math.sin(angle + Math.PI / 2);
      const shaftEndX = to.x - Math.cos(angle) * (headLength * 0.8);
      const shaftEndY = to.y - Math.sin(angle) * (headLength * 0.8);
      pCtx.beginPath();
      pCtx.moveTo(from.x - vX * shaftStartWidth / 2, from.y - vY * shaftStartWidth / 2);
      pCtx.lineTo(from.x + vX * shaftStartWidth / 2, from.y + vY * shaftStartWidth / 2);
      pCtx.lineTo(shaftEndX + vX * shaftEndWidth / 2, shaftEndY + vY * shaftEndWidth / 2);
      pCtx.lineTo(shaftEndX - vX * shaftEndWidth / 2, shaftEndY - vY * shaftEndWidth / 2);
      pCtx.closePath();
      pCtx.fill();
      const headBaseX = to.x - Math.cos(angle) * headLength;
      const headBaseY = to.y - Math.sin(angle) * headLength;
      pCtx.beginPath();
      pCtx.moveTo(to.x, to.y);
      pCtx.lineTo(headBaseX + vX * headWidth / 2, headBaseY + vY * headWidth / 2);
      pCtx.lineTo(headBaseX - vX * headWidth / 2, headBaseY - vY * headWidth / 2);
      pCtx.closePath();
      pCtx.fill();
      pCtx.restore();
    }
    function drawNumber(pCtx, pos, num, color = NUMBER_COLOR, size = NUMBER_SIZE) {
      pCtx.save();
      const text = String(num);
      pCtx.font = `bold ${size}px Arial, sans-serif`;
      const radius = size * 0.7;
      pCtx.fillStyle = NUMBER_BG;
      pCtx.beginPath();
      pCtx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);
      pCtx.fill();
      pCtx.strokeStyle = color;
      pCtx.lineWidth = Math.max(2, size / 12);
      pCtx.stroke();
      pCtx.fillStyle = color;
      pCtx.textAlign = "center";
      pCtx.textBaseline = "middle";
      pCtx.fillText(text, pos.x, pos.y);
      pCtx.restore();
    }

    function drawText(pCtx, pos, textVal, color, size) {
      pCtx.save();
      pCtx.font = `bold ${size}px "Microsoft YaHei", sans-serif`;
      pCtx.fillStyle = color;
      pCtx.textAlign = "center";
      pCtx.textBaseline = "middle";
      pCtx.fillText(textVal, pos.x, pos.y);
      pCtx.restore();
    }

    // 将箭头添加到注解层

    function drawArrowOnImage(from, to) {
      annotations.push({
        type: "arrow",
        from: { ...from },
        to: { ...to },
        color: getStrokeColor(),
        width: getStrokeWidth()
      });
    }

    function drawLineOnImage(from, to) {
      annotations.push({
        type: "line",
        from: { ...from },
        to: { ...to },
        color: getStrokeColor(),
        width: getStrokeWidth()
      });
    }

    function drawRectOnImage(from, to) {
      annotations.push({
        type: "rect",
        from: { ...from },
        to: { ...to },
        color: getStrokeColor(),
        width: getStrokeWidth()
      });
    }

    function drawCircleOnImage(from, to) {
      annotations.push({
        type: "circle",
        from: { ...from },
        to: { ...to },
        color: getStrokeColor(),
        width: getStrokeWidth()
      });
    }

    function drawNumberOnImage(pos, num) {
      const baseSize = 14;
      const sizeMultiplier = 2;
      const size = baseSize + parseInt(getStrokeWidth() || 4) * sizeMultiplier;
      annotations.push({ type: "number", pos: { ...pos }, val: num, color: getStrokeColor(), size });
    }

    function drawTextOnImage(pos, textVal) {
      const baseSize = 14;
      const sizeMultiplier = 3;
      const size = baseSize + parseInt(getStrokeWidth() || 4) * sizeMultiplier;
      annotations.push({ type: "text", pos: { ...pos }, val: textVal, color: getStrokeColor(), size });
    }

    function exportCanvasDataUrl() {
      const tempCanvas = document.createElement("canvas");
      tempCanvas.width = canvas.width;
      tempCanvas.height = canvas.height;
      const tctx = tempCanvas.getContext("2d");
      tctx.putImageData(imageData, 0, 0);
      for (const layer of pastedImages) {
        const source = getPastedImageSource(layer);
        if (!source) continue;
        tctx.drawImage(source, layer.x, layer.y, layer.width, layer.height);
      }
      for (const ann of annotations) {
        if (ann.type === "arrow") {
          drawArrow(tctx, ann.from, ann.to, ann);
        } else if (ann.type === "line") {
          drawLine(tctx, ann.from, ann.to, ann);
        } else if (ann.type === "rect") {
          drawRect(tctx, ann.from, ann.to, ann);
        } else if (ann.type === "circle") {
          drawCircle(tctx, ann.from, ann.to, ann);
        } else if (ann.type === "number") {
          drawNumber(tctx, ann.pos, ann.val, ann.color, ann.size);
        } else if (ann.type === "text") {
          drawText(tctx, ann.pos, ann.val, ann.color, ann.size);
        }
      }
      return tempCanvas.toDataURL("image/png");
    }

    function renderBaseImage() {
      if (!imageData) return;
      ctx.putImageData(imageData, 0, 0);
      for (const layer of pastedImages) {
        const source = getPastedImageSource(layer);
        if (source) {
          ctx.drawImage(source, layer.x, layer.y, layer.width, layer.height);
        }
      }
    }

    function renderAnnotationsOnly() {
      if (!imageData) return;
      renderBaseImage();
      for (const ann of annotations) {
        if (ann.type === "arrow") {
          drawArrow(ctx, ann.from, ann.to, ann);
        } else if (ann.type === "line") {
          drawLine(ctx, ann.from, ann.to, ann);
        } else if (ann.type === "rect") {
          drawRect(ctx, ann.from, ann.to, ann);
        } else if (ann.type === "circle") {
          drawCircle(ctx, ann.from, ann.to, ann);
        } else if (ann.type === "number") {
          drawNumber(ctx, ann.pos, ann.val, ann.color, ann.size);
        } else if (ann.type === "text") {
          drawText(ctx, ann.pos, ann.val, ann.color, ann.size);
        }
      }
      for (const layer of pastedImages) {
        if (isSelectedElement("pastedImage", layer)) {
          drawPastedImageSelection(layer);
        }
      }
      for (const ann of annotations) {
        if (isSelectedElement("annotation", ann)) {
          if (ann.type === "number" || ann.type === "text") {
            const bounds = getAnnotationBounds(ann);
            if (bounds) {
              ctx.save();
              ctx.strokeStyle = "rgba(0, 120, 215, 0.9)";
              ctx.setLineDash([4, 4]);
              ctx.lineWidth = 1;
              ctx.strokeRect(bounds.x, bounds.y, bounds.w, bounds.h);
              ctx.restore();
            }
          }
          drawAnnotationHandles(ann);
        }
      }
      drawSelectionOverlay();
      updateMetrics();
    }

    function render() {
      if (!imageData) {
        canvas.hidden = true;
        empty.hidden = false;
        return;
      }
      canvas.hidden = false;
      empty.hidden = true;
      applyCanvasZoom();
      renderBaseImage();
      for (const ann of annotations) {
        if (ann.type === "arrow") {
          drawArrow(ctx, ann.from, ann.to, ann);
        } else if (ann.type === "line") {
          drawLine(ctx, ann.from, ann.to, ann);
        } else if (ann.type === "rect") {
          drawRect(ctx, ann.from, ann.to, ann);
        } else if (ann.type === "circle") {
          drawCircle(ctx, ann.from, ann.to, ann);
        } else if (ann.type === "number") {
          drawNumber(ctx, ann.pos, ann.val, ann.color, ann.size);
        } else if (ann.type === "text") {
          drawText(ctx, ann.pos, ann.val, ann.color, ann.size);
        }
      }
      for (const layer of pastedImages) {
        if (isSelectedElement("pastedImage", layer)) {
          drawPastedImageSelection(layer);
        }
      }
      for (const ann of annotations) {
        if (isSelectedElement("annotation", ann)) {
          if (ann.type === "number" || ann.type === "text") {
            const bounds = getAnnotationBounds(ann);
            if (bounds) {
              ctx.save();
              ctx.strokeStyle = "rgba(0, 120, 215, 0.9)";
              ctx.setLineDash([4, 4]);
              ctx.lineWidth = 1;
              ctx.strokeRect(bounds.x, bounds.y, bounds.w, bounds.h);
              ctx.restore();
            }
          }
          drawAnnotationHandles(ann);
        }
      }
      drawSelectionOverlay();
      updateButtons();
      updateMetrics();
    }

    function findAnnotationAt(p) {
      for (let i = annotations.length - 1; i >= 0; i--) {
        const ann = annotations[i];
        if (ann.type === "number") {
          const size = ann.size || NUMBER_SIZE;
          if (Math.hypot(p.x - ann.pos.x, p.y - ann.pos.y) < size * 0.8) return ann;
        } else if (ann.type === "text") {
          ctx.font = `bold ${ann.size}px "Microsoft YaHei", sans-serif`;
          const metrics = ctx.measureText(ann.val);
          const w = metrics.width + 16;
          const h = ann.size + 16;
          if (p.x >= ann.pos.x - w / 2 && p.x <= ann.pos.x + w / 2 &&
            p.y >= ann.pos.y - h / 2 && p.y <= ann.pos.y + h / 2) return ann;
        } else if (ann.type === "arrow" || ann.type === "line") {
          const threshold = Math.max(10, getAnnotationStroke(ann).width + 6);
          if (isPointNearSegment(p, ann.from, ann.to, threshold)) return ann;
        } else if (ann.type === "rect") {
          const rect = normalizeRect(ann.from, ann.to);
          if (rect) {
            const threshold = Math.max(10, getAnnotationStroke(ann).width + 6);
            // 检查是否在矩形边框上
            if (isPointNearRectBorder(p, rect, threshold)) return ann;
          }
        } else if (ann.type === "circle") {
          const rx = Math.abs(ann.to.x - ann.from.x);
          const ry = Math.abs(ann.to.y - ann.from.y);
          const threshold = Math.max(10, getAnnotationStroke(ann).width + 6);
          if (rx < 1 || ry < 1) {
            if (Math.hypot(p.x - ann.from.x, p.y - ann.from.y) < threshold) return ann;
          } else {
            const dx = p.x - ann.from.x;
            const dy = p.y - ann.from.y;
            const distNorm = Math.sqrt((dx / rx) ** 2 + (dy / ry) ** 2);
            const avgR = (rx + ry) / 2;
            if (Math.abs(distNorm - 1) * avgR < threshold) return ann;
          }
        }
      }
      return null;
    }
    function isPointNearRectBorder(p, rect, threshold) {
      const { x, y, w, h } = rect;
      const onTop = Math.abs(p.y - y) < threshold && p.x >= x - threshold && p.x <= x + w + threshold;
      const onBottom = Math.abs(p.y - (y + h)) < threshold && p.x >= x - threshold && p.x <= x + w + threshold;
      const onLeft = Math.abs(p.x - x) < threshold && p.y >= y - threshold && p.y <= y + h + threshold;
      const onRight = Math.abs(p.x - (x + w)) < threshold && p.y >= y - threshold && p.y <= y + h + threshold;
      return onTop || onBottom || onLeft || onRight;
    }
    function isPointNearSegment(p, a, b, threshold) {
      const l2 = Math.hypot(a.x - b.x, a.y - b.y) ** 2;
      if (l2 === 0) return Math.hypot(p.x - a.x, p.y - a.y) < threshold;
      let t = ((p.x - a.x) * (b.x - a.x) + (p.y - a.y) * (b.y - a.y)) / l2;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(p.x - (a.x + t * (b.x - a.x)), p.y - (a.y + t * (b.y - a.y))) < threshold;
    }

    function loadImageToCanvas(img) {
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);
      imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      originalData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      zoomScale = 1;
      annotations = [];
      pastedImages = [];
      clearSelectedElement();
      draggingAnnotation = null;
      draggingPastedImage = null;
      numberCounter = 1;
      clearSelection();
      clearHistory();
      setStatus(`图片已载入: ${canvas.width} x ${canvas.height}`);
      render();
    }

    async function handlePaste(event) {
      console.log("Paste event triggered");
      const items = event.clipboardData && event.clipboardData.items;
      if (!items) return;
      for (const item of items) {
        if (item.type && item.type.startsWith("image/")) {
          const file = item.getAsFile();
          if (!file) continue;
          const url = URL.createObjectURL(file);
          const img = new Image();
          img.onload = () => {
            const MAX_PIXELS = 4096 * 4096;
            const pixels = img.naturalWidth * img.naturalHeight;
            if (pixels > MAX_PIXELS) {
              const scale = Math.sqrt(MAX_PIXELS / pixels);
              const tempCanvas = document.createElement('canvas');
              tempCanvas.width = Math.round(img.naturalWidth * scale);
              tempCanvas.height = Math.round(img.naturalHeight * scale);
              const tctx = tempCanvas.getContext('2d');
              tctx.drawImage(img, 0, 0, tempCanvas.width, tempCanvas.height);
              const dataUrl = tempCanvas.toDataURL();
              img.src = dataUrl;
              img.onload = () => {
                if (imageData) {
                  appendImageToCanvas(img);
                } else {
                  loadImageToCanvas(img);
                }
                setStatus(`图片已自动缩放至 ${img.naturalWidth}x${img.naturalHeight}（超过最大 16.8Mpx）`);
              };
              return;
            }
            if (imageData) {
              appendImageToCanvas(img);
            } else {
              loadImageToCanvas(img);
            }
            URL.revokeObjectURL(url);
          };
          img.onerror = () => {
            setStatus("图片读取失败，请重试。");
            URL.revokeObjectURL(url);
          };
          img.src = url;
          event.preventDefault();
          return;
        }
      }
      setStatus("剪贴板里没有图片数据。");
    }

    function getCanvasY(event) {
      const rect = canvas.getBoundingClientRect();
      const scaleY = canvas.height / rect.height;
      return (event.clientY - rect.top) * scaleY;
    }

    function getCanvasPoint(event) {
      return getCanvasPointFromClient(event.clientX, event.clientY);
    }

    function mosaicRectOnCurrentImage(rect, blockSize) {
      const tempCanvas = document.createElement("canvas");
      tempCanvas.width = canvas.width;
      tempCanvas.height = canvas.height;
      const tctx = tempCanvas.getContext("2d");
      tctx.putImageData(imageData, 0, 0);
      for (let y = rect.y; y < rect.y + rect.h; y += blockSize) {
        for (let x = rect.x; x < rect.x + rect.w; x += blockSize) {
          const bw = Math.min(blockSize, rect.x + rect.w - x);
          const bh = Math.min(blockSize, rect.y + rect.h - y);
          const blockData = tctx.getImageData(x, y, bw, bh).data;
          let r = 0, g = 0, b = 0, count = 0;
          for (let i = 0; i < blockData.length; i += 4) {
            r += blockData[i]; g += blockData[i + 1]; b += blockData[i + 2];
            count++;
          }
          tctx.fillStyle = `rgb(${Math.round(r / count)}, ${Math.round(g / count)}, ${Math.round(b / count)})`;
          tctx.fillRect(x, y, bw, bh);
        }
      }
      return tctx.getImageData(0, 0, canvas.width, canvas.height);
    }

    function clampZoom(next) {
      return Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, next));
    }

    function updateZoomByWheel(event) {
      if (!imageData || !event.ctrlKey) return;
      event.preventDefault();
      const dir = event.deltaY < 0 ? 1 : -1;
      const next = clampZoom(zoomScale + dir * ZOOM_STEP);
      if (next === zoomScale) return;
      zoomScale = next;
      render();
      setStatus(`当前缩放 ${(zoomScale * 100).toFixed(0)}%`);
    }


    canvas.addEventListener("mousedown", (e) => {
      if (e.button !== 0) return;
      if (!imageData) return;
      updatePointerCanvasPoint(e.clientX, e.clientY);
      const p = getCanvasPoint(e);
      const hit = findElementAt(p);
      hasMovedDuringDrag = false;
      if (startDraggingElement(hit, p)) {
        render();
        return;
      }
      clearSelectedElement();

      selecting = true;
      dragType = currentTool;

      if (currentTool === "mosaic") {
        mosaicStart = p;
        mosaicCurrent = p;
      } else if (currentTool === "arrow") {
        arrowStart = p;
        arrowCurrent = p;
      } else if (currentTool === "line") {
        lineStart = p;
        lineCurrent = p;
      } else if (currentTool === "rect") {
        rectStart = p;
        rectCurrent = p;
      } else if (currentTool === "circle") {
        circleStart = p;
        circleCurrent = p;
      } else if (currentTool === "number") {
        pushUndoState();
        const numVal = parseInt(numberAnnotationInput.value) || numberCounter;
        drawNumberOnImage(p, numVal);
        numberCounter = numVal + 1;
        numberAnnotationInput.value = numberCounter;
        selecting = false;
        setStatus(`已添加数字 ${numVal}`);
        render();
        return;
      } else if (currentTool === "text") {
        pushUndoState();
        const textVal = textAnnotationInput.value || "文字内容";
        drawTextOnImage(p, textVal);
        selecting = false;
        setStatus(`已添加文字`);
        render();
        return;
      } else {
        dragType = "range";
        dragStartY = p.y;
        dragCurrentY = p.y;
        if (e.shiftKey) {
          dragMode = "subtract";
        } else if (e.ctrlKey || e.metaKey) {
          dragMode = "add";
        } else {
          dragMode = "replace";
        }
      }
      render();
      updateButtons();
    });

    window.addEventListener("mousemove", (e) => {
      if (!imageData) return;
      isShiftPressed = e.shiftKey;
      updatePointerCanvasPoint(e.clientX, e.clientY);
      const p = getCanvasPoint(e);

      if (moveDraggingElement(p)) {
        renderAnnotationsOnly();
        return;
      }

      // 更新鼠标指针样式
      if (!selecting) {
        const hit = findElementAt(p);
        if (hit && hit.handle) {
          const cursors = {
            nw: "nwse-resize",
            ne: "nesw-resize",
            sw: "nesw-resize",
            se: "nwse-resize",
            n: "ns-resize",
            s: "ns-resize",
            w: "ew-resize",
            e: "ew-resize",
            from: "crosshair",
            to: "crosshair"
          };
          canvas.style.cursor = cursors[hit.handle] || "default";
        } else if (hit && hit.kind === "pastedImage" && hit.resize) {
          canvas.style.cursor = "nwse-resize";
        } else if (hit) {
          canvas.style.cursor = "move";
        } else {
          canvas.style.cursor = "default";
        }
      }

      if (!selecting) return;
      if (dragType === "mosaic") {
        mosaicCurrent = p;
      } else if (dragType === "arrow") {
        arrowCurrent = p;
      } else if (dragType === "line") {
        lineCurrent = p;
      } else if (dragType === "rect") {
        rectCurrent = p;
      } else if (dragType === "circle") {
        circleCurrent = p;
      } else {
        dragCurrentY = p.y;
      }
      render();
      updateButtons();
    });

    window.addEventListener("mouseup", (e) => {
      if (e.button !== 0) return;
      if (finishDraggingElement()) {
        return;
      }

      if (!selecting) return;
      if (dragType === "mosaic") {
        const rect = normalizeRect(mosaicStart, mosaicCurrent);
        selecting = false;
        mosaicStart = null;
        mosaicCurrent = null;
        if (rect) {
          pushUndoState();
          commitPastedImagesToBase();
          imageData = mosaicRectOnCurrentImage(rect, MOSAIC_BLOCK);
          setStatus(`已完成马赛克: x=${rect.x}, y=${rect.y}, ${rect.w}x${rect.h}px`);
        } else {
          setStatus("马赛克区域无效，请重新拖拽。");
        }
      } else if (dragType === "arrow") {
        selecting = false;
        if (arrowStart && arrowCurrent) {
          const dist = Math.hypot(arrowCurrent.x - arrowStart.x, arrowCurrent.y - arrowStart.y);
          if (dist > 5) {
            pushUndoState();
            drawArrowOnImage(arrowStart, arrowCurrent);
            setStatus("已添加箭头");
          }
        }
        arrowStart = null;
        arrowCurrent = null;
      } else if (dragType === "line") {
        selecting = false;
        const lineEnd = constrainLinePoint(lineStart, lineCurrent, e.shiftKey);
        if (lineStart && lineEnd) {
          const dist = Math.hypot(lineEnd.x - lineStart.x, lineEnd.y - lineStart.y);
          if (dist > 2) {
            pushUndoState();
            drawLineOnImage(lineStart, lineEnd);
            setStatus("已添加线条");
          }
        }
        lineStart = null;
        lineCurrent = null;
      } else if (dragType === "rect") {
        selecting = false;
        if (rectStart && rectCurrent) {
          const finalTo = getPreviewRectEnd(rectStart, rectCurrent, e.shiftKey);
          if (Math.abs(finalTo.x - rectStart.x) > 2 || Math.abs(finalTo.y - rectStart.y) > 2) {
            pushUndoState();
            drawRectOnImage(rectStart, finalTo);
            setStatus("已添加矩形");
          }
        }
        rectStart = null;
        rectCurrent = null;
      } else if (dragType === "circle") {
        selecting = false;
        if (circleStart && circleCurrent) {
          const finalTo = getPreviewCircleEnd(circleStart, circleCurrent, e.shiftKey);
          if (Math.abs(finalTo.x - circleStart.x) > 2 || Math.abs(finalTo.y - circleStart.y) > 2) {
            pushUndoState();
            drawCircleOnImage(circleStart, finalTo);
            setStatus("已添加圆形/椭圆");
          }
        }
        circleStart = null;
        circleCurrent = null;
      } else {
        const isPlainClick = dragMode === "replace"
          && dragStartY !== null
          && dragCurrentY !== null
          && Math.abs(dragCurrentY - dragStartY) <= CLICK_CLEAR_THRESHOLD;
        const draft = normalizeRange(dragStartY, dragCurrentY);
        if (isPlainClick) {
          cutRanges = [];
        } else if (draft) {
          if (dragMode === "add") {
            cutRanges = addRange(cutRanges, draft);
          } else if (dragMode === "subtract") {
            cutRanges = subtractRange(cutRanges, draft);
          } else {
            cutRanges = [draft];
          }
        }
        selecting = false;
        dragStartY = null;
        dragCurrentY = null;
        if (hasSelection()) {
          setStatus(`已更新区间：${cutRanges.length} 段，总删除高度 ${totalSelectedHeight(cutRanges)}px。按 Delete 或点击按钮执行删除并接续`);
        } else {
          setStatus("当前没有选中区间。");
        }
      }
      render();
      updateButtons();
    });

    function setTool(tool) {
      if (!imageData) return;
      currentTool = tool;
      selecting = false;
      mosaicStart = null;
      mosaicCurrent = null;
      arrowStart = null;
      arrowCurrent = null;
      lineStart = null;
      lineCurrent = null;
      rectStart = null;
      rectCurrent = null;
      circleStart = null;
      circleCurrent = null;

      if (tool !== "range") {
        clearSelection();
      }

      setStatus(`当前工具已切换为: ${getToolName(tool)}`);
      render();
      updateButtons();
    }

    btnSelect.addEventListener("click", () => setTool("range"));
    btnMosaic.addEventListener("click", () => setTool("mosaic"));
    btnArrow.addEventListener("click", () => setTool("arrow"));
    btnLine.addEventListener("click", () => setTool("line"));
    btnRect.addEventListener("click", () => setTool("rect"));
    btnCircle.addEventListener("click", () => setTool("circle"));
    btnNumber.addEventListener("click", () => setTool("number"));
    btnText.addEventListener("click", () => setTool("text"));
    btnZoomReset.addEventListener("click", () => {
      if (!imageData) return;
      zoomScale = 1;
      render();
      setStatus("缩放已还原到 1:1");
    });

    function doCut() {
      if (!imageData || !hasSelection()) return;
      const ranges = mergeRanges(cutRanges);
      const removed = totalSelectedHeight(ranges);
      if (removed <= 0 || removed >= canvas.height) {
        setStatus("选中高度无效，无法删除整个图片。");
        return;
      }
      if (removed > 200) {
        if (!confirm(`确定要删除 ${removed}px（${ranges.length} 段）吗？此操作可撤销。`)) {
          return;
        }
      }
      pushUndoState();
      commitPastedImagesToBase();

      const oldCanvas = document.createElement("canvas");
      oldCanvas.width = canvas.width;
      oldCanvas.height = canvas.height;
      // commitPastedImagesToBase(); // 移除强制合并，改为坐标转换
      oldCanvas.getContext("2d").putImageData(imageData, 0, 0);

      const gapTotal = CUT_GAP_PX * ranges.length;
      const newH = canvas.height - removed + gapTotal;
      const newCanvas = document.createElement("canvas");
      newCanvas.width = canvas.width;
      newCanvas.height = newH;
      const nctx = newCanvas.getContext("2d");
      nctx.fillStyle = CUT_GAP_COLOR;

      let srcY = 0;
      let dstY = 0;
      for (const r of ranges) {
        const keepH = r.y1 - srcY;
        if (keepH > 0) {
          nctx.drawImage(oldCanvas, 0, srcY, canvas.width, keepH, 0, dstY, canvas.width, keepH);
          dstY += keepH;
        }
        // 自适应缝隙颜色：取缝隙上下边缘的像素均值
        if (ranges.length === 1) {
          const oldCtx = oldCanvas.getContext("2d");
          const topPixels = oldCtx.getImageData(0, Math.max(0, r.y1 - 1), canvas.width, 1).data;
          const botPixels = oldCtx.getImageData(0, Math.min(canvas.height - 1, r.y1), canvas.width, 1).data;
          let tr = 0, tg = 0, tb = 0;
          let br = 0, bg = 0, bb = 0;
          const step = Math.max(1, Math.floor(canvas.width / 100));
          for (let i = 0; i < canvas.width; i += step) {
            const ti = i * 4;
            tr += topPixels[ti]; tg += topPixels[ti + 1]; tb += topPixels[ti + 2];
            br += botPixels[ti]; bg += botPixels[ti + 1]; bb += botPixels[ti + 2];
          }
          const cnt = Math.floor(canvas.width / step);
          nctx.fillStyle = `rgb(${Math.round((tr + br) / 2 / cnt)},${Math.round((tg + bg) / 2 / cnt)},${Math.round((tb + bb) / 2 / cnt)})`;
        }
        nctx.fillRect(0, dstY, canvas.width, CUT_GAP_PX);
        dstY += CUT_GAP_PX;
        srcY = r.y2;
      }
      const tailH = canvas.height - srcY;
      if (tailH > 0) {
        nctx.drawImage(oldCanvas, 0, srcY, canvas.width, tailH, 0, dstY, canvas.width, tailH);
      }

      // 裁剪时同步更新注解和图层坐标
      transformAnnotations(ranges);
      transformPastedImages(ranges);

      canvas.width = newCanvas.width;
      canvas.height = newCanvas.height;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(newCanvas, 0, 0);
      imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      clearSelection();
      setStatus(`已删除 ${removed}px（${ranges.length} 段），并插入 ${ranges.length} 条 ${CUT_GAP_PX}px 裁剪缝`);
      render();
    }


    function transformAnnotations(ranges) {
      for (const ann of annotations) {
        if (ann.type === "number" || ann.type === "text") {
          ann.pos.y = calculateNewY(ann.pos.y, ranges);
        } else if (ann.type === "arrow" || ann.type === "line" || ann.type === "rect" || ann.type === "circle") {
          ann.from.y = calculateNewY(ann.from.y, ranges);
          ann.to.y = calculateNewY(ann.to.y, ranges);
        }
      }
    }
    function transformPastedImages(ranges) {
      for (const layer of pastedImages) {
        layer.y = calculateNewY(layer.y, ranges);
      }
    }
    function calculateNewY(oldY, ranges) {
      let offset = 0;
      for (const r of ranges) {
        if (oldY > r.y2) {
          offset += (r.y2 - r.y1) - CUT_GAP_PX;
        } else if (oldY >= r.y1 && oldY <= r.y2) {
          offset += (oldY - r.y1);
        }
      }
      return oldY - offset;
    }

    btnReset.addEventListener("click", () => {
      if (!originalData) return;
      if (!confirm("确定要恢复到初始图片？所有未保存的更改将丢失。")) return;
      pushUndoState();
      applyImageData({
        data: originalData,
        anns: [],
        layers: [],
        counter: 1
      });
      setStatus(`已恢复初始图片: ${canvas.width} x ${canvas.height}`);
    });

    btnUndo.addEventListener("click", () => {
      if (!imageData || undoStack.length === 0) return;
      redoStack.push({
        data: cloneImageData(imageData),
