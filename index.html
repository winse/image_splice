        anns: JSON.parse(JSON.stringify(annotations)),
        layers: clonePastedImages(pastedImages),
        counter: numberCounter
      });
      const prev = undoStack.pop();
      applyImageData(prev);
      setStatus(`已撤销，剩余可撤销 ${undoStack.length} 步`);
      updateButtons();
    });

    btnRedo.addEventListener("click", () => {
      if (!imageData || redoStack.length === 0) return;
      undoStack.push({
        data: cloneImageData(imageData),
        anns: JSON.parse(JSON.stringify(annotations)),
        layers: clonePastedImages(pastedImages),
        counter: numberCounter
      });
      const next = redoStack.pop();
      applyImageData(next);
      setStatus(`已重做，剩余可重做 ${redoStack.length} 步`);
      updateButtons();
    });

    btnSave.addEventListener("click", () => {
      if (!imageData) return;
      const link = document.createElement("a");
      link.download = `cut-splice-${Date.now()}.png`;
      link.href = exportCanvasDataUrl();
      link.click();
      setStatus("已触发下载。");
    });

    btnQuickDelete.addEventListener("click", () => {
      if (deleteSelectedElement()) {
        return;
      }
      if (imageData && hasSelection()) {
        doCut();
      }
    });

    window.addEventListener("paste", handlePaste);
    canvasBox.addEventListener("wheel", updateZoomByWheel, { passive: false });

    window.addEventListener("keydown", (event) => {
      if (event.key === "Shift") {
        isShiftPressed = true;
        if (selecting && dragType === "line") {
          render();
        }
      }

      const key = event.key.toLowerCase();
      const ctrlOrMeta = event.ctrlKey || event.metaKey;

      if (!ctrlOrMeta && imageData) {
        if (key === "s") {
          event.preventDefault();
          setTool("range");
          return;
        }
        if (key === "a") {
          event.preventDefault();
          setTool("arrow");
          return;
        }
        if (key === "l") {
          event.preventDefault();
          setTool("line");
          return;
        }
        if (key === "r") {
          event.preventDefault();
          setTool("rect");
          return;
        }
        if (key === "c") {
          event.preventDefault();
          setTool("circle");
          return;
        }
        if (key === "n") {
          event.preventDefault();
          setTool("number");
          return;
        }
        if (key === "m") {
          event.preventDefault();
          setTool("mosaic");
          return;
        }
        if (key === "t") {
          event.preventDefault();
          setTool("text");
          return;
        }
        if (key === "delete") {
          if (deleteSelectedElement()) {
            return;
          }
          if (imageData && hasSelection()) {
            event.preventDefault();
            doCut();
          }
          return;
        }
      }

      if (!ctrlOrMeta) return;

      if (key === "z" && !event.shiftKey) {
        if (!btnUndo.disabled) {
          event.preventDefault();
          btnUndo.click();
        }
        return;
      }
      if ((key === "z" && event.shiftKey) || key === "y") {
        if (!btnRedo.disabled) {
          event.preventDefault();
          btnRedo.click();
        }
        return;
      }
    });

    window.addEventListener("keyup", (event) => {
      if (event.key !== "Shift") return;
      isShiftPressed = false;
      if (selecting && dragType === "line") {
        render();
      }
    });

    strokeColorInput.addEventListener("input", () => {
      const color = getStrokeColor();
      if (selectedAnnotation) {
        if (!hasMovedDuringDrag) pushUndoState();
        hasMovedDuringDrag = true;
        selectedAnnotation.color = color;
        render();
      }
      if (currentTool === "arrow" || currentTool === "line" || currentTool === "rect" || currentTool === "circle") {
        setStatus(`${getToolName(currentTool)}样式已更新：${getStrokeWidth()}px ${color.toUpperCase()}`);
      }
    });

    strokeWidthInput.addEventListener("input", () => {
      syncStrokeControls();
      const width = getStrokeWidth();
      if (selectedAnnotation) {
        if (!hasMovedDuringDrag) pushUndoState();
        hasMovedDuringDrag = true;
        if (selectedAnnotation.type === "number") {
          selectedAnnotation.size = 14 + width * 2;
        } else if (selectedAnnotation.type === "text") {
          selectedAnnotation.size = 14 + width * 3;
        } else {
          selectedAnnotation.width = width;
        }
        render();
      }
      if (currentTool === "arrow" || currentTool === "line" || currentTool === "rect" || currentTool === "circle") {
        setStatus(`${getToolName(currentTool)}样式已更新：${width}px ${getStrokeColor().toUpperCase()}`);
      }
    });

    numberAnnotationInput.addEventListener("input", () => {
      const val = parseInt(numberAnnotationInput.value);
      if (!isNaN(val)) {
        if (selectedAnnotation && selectedAnnotation.type === "number") {
          if (!hasMovedDuringDrag) pushUndoState();
          hasMovedDuringDrag = true;
          selectedAnnotation.val = val;
          render();
        } else {
          numberCounter = val;
        }
      }
    });

    textAnnotationInput.addEventListener("input", () => {
      const val = textAnnotationInput.value;
      if (selectedAnnotation && selectedAnnotation.type === "text") {
        if (!hasMovedDuringDrag) pushUndoState();
        hasMovedDuringDrag = true;
        selectedAnnotation.val = val;
        render();
      }
    });

    function rotateImageData(src, direction) {
      const { width, height, data } = src;
      const newW = direction === 'cw' || direction === 'ccw' ? height : width;
      const newH = direction === 'cw' || direction === 'ccw' ? width : height;
      const dst = new ImageData(newW, newH);
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const srcIdx = (y * width + x) * 4;
          let dstX, dstY;
          if (direction === 'cw') {
            dstX = height - 1 - y;
            dstY = x;
          } else if (direction === 'ccw') {
            dstX = y;
            dstY = width - 1 - x;
          } else if (direction === 'flipH') {
            dstX = width - 1 - x;
            dstY = y;
          } else {
            dstX = x;
            dstY = height - 1 - y;
          }
          const dstIdx = (dstY * newW + dstX) * 4;
          dst.data[dstIdx] = data[srcIdx];
          dst.data[dstIdx + 1] = data[srcIdx + 1];
          dst.data[dstIdx + 2] = data[srcIdx + 2];
          dst.data[dstIdx + 3] = data[srcIdx + 3];
        }
      }
      return dst;
    }

    function doRotate(direction) {
      if (!imageData) return;
      pushUndoState();
      commitPastedImagesToBase();
      imageData = rotateImageData(imageData, direction);
      for (const layer of pastedImages) {
        if (direction === 'cw') {
          const oldX = layer.x;
          layer.x = canvas.height - layer.y - layer.height;
          layer.y = oldX;
          const oldW = layer.width;
          layer.width = layer.height;
          layer.height = oldW;
        } else if (direction === 'ccw') {
          const oldX = layer.x;
          layer.x = layer.y;
          layer.y = canvas.width - layer.x - layer.width;
          const oldW = layer.width;
          layer.width = layer.height;
          layer.height = oldW;
        } else if (direction === 'flipH') {
          layer.x = canvas.width - layer.x - layer.width;
        } else {
          layer.y = canvas.height - layer.y - layer.height;
        }
      }
      zoomScale = 1;
      render();
      const names = { cw: '顺时针', ccw: '逆时针', flipH: '水平', flipV: '垂直' };
      setStatus(`图片已${names[direction]}翻转`);
    }

    btnRotateL.addEventListener("click", () => doRotate('ccw'));
    btnRotateR.addEventListener("click", () => doRotate('cw'));
    btnFlipH.addEventListener("click", () => doRotate('flipH'));
    btnFlipV.addEventListener("click", () => doRotate('flipV'));

    window.onerror = function(msg, url, line, col, error) {
      setStatus(`脚本错误: ${msg} (第${line}行)`);
      console.error(msg, url, line, col, error);
      return false;
    };

    syncStrokeControls();
    setStatus("等待粘贴图片...");
    updateButtons();
  </script>
</body>

</html>
